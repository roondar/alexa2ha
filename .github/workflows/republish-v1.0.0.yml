name: Republish v1.0.0 once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  republish:
    if: github.event.head_commit.message == 'chore: republish v1.0.0 release'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recreate v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 --verify-tag --generate-notes
